name: Crear imágenes Instagram FLUYNOVA
on:
  push:
    branches: [main]
    paths:
      - 'marketing/create_instagram_assets.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-social-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Crear imágenes de campaña
        run: python marketing/create_instagram_assets.py
      - name: Guardar recursos gráficos en web
        run: |
          git config user.name 'FLUYNOVA Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/marketing/*.jpg
          if git diff --cached --quiet; then
            echo "Sin modificaciones de imágenes"
          else
            git commit -m "Publicar cuatro piezas de campaña de Instagram"
            git push origin HEAD:main
          fi
