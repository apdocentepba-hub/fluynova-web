name: FLUYNOVA — receptor D1 aislado (sin deploy)

on:
  push:
    branches:
      - feature/fluynova-contact-d1-isolated-20261107
    paths:
      - 'infra/fluynova-contact-worker/**'
      - 'tests/fluynova-contact-worker.test.mjs'
      - '.github/workflows/fluynova-contact-d1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-ingress-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspeccionar sintaxis
        run: |
          node --check infra/fluynova-contact-worker/index.mjs
          node --check tests/fluynova-contact-worker.test.mjs
      - name: Pruebas con D1 y CAPTCHA simulados; sin red ni envíos
        run: node --test tests/fluynova-contact-worker.test.mjs
      - name: Comprobar que no hay secretos o credenciales publicadas
        run: |
          test -f infra/fluynova-contact-worker/schema.sql
          ! grep -Eq 'service_role|SUPABASE_SERVICE_ROLE|BEGIN PRIVATE KEY|password=' infra/fluynova-contact-worker/index.mjs
