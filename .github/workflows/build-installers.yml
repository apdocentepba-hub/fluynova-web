name: Compilar suite FLUYNOVA Windows con licencias 0.2.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'productos/source-payload.b64'
      - 'productos/upgrade-v0.2.b64'
      - '.github/workflows/build-installers.yml'
permissions:
  contents: write
jobs:
  windows-installers:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extraer código y recursos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force productos | Out-Null
          $b64 = (Get-Content -Raw 'productos/source-payload.b64').Trim()
          [IO.File]::WriteAllBytes('productos\source.tar.gz',[Convert]::FromBase64String($b64))
          tar -xzf 'productos/source.tar.gz' -C productos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upgrade = (Get-Content -Raw 'productos/upgrade-v0.2.b64').Trim()
          [IO.File]::WriteAllBytes('productos\\upgrade.tar.gz',[Convert]::FromBase64String($upgrade))
          tar -xzf 'productos/upgrade.tar.gz' -C productos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Instalar herramientas de compilación
        working-directory: productos
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Verificar lógica de negocio y licenciamiento
        working-directory: productos
        shell: pwsh
        run: |
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar cinco productos comerciales y emisor sin clave
        working-directory: productos
        shell: pwsh
        run: |
          $names = @{
            'Pedidos'='pedidos.py'; 'Turnos'='turnos.py'; 'Stock'='stock.py';
            'Fabrica'='fabrica.py'; 'Evidencia'='evidencia.py';
            'LicenciasOperador'='licencias_operador.py'
          }
          foreach ($product in @('Pedidos','Turnos','Stock','Fabrica','Evidencia','LicenciasOperador')) {
            $script=$names[$product]
            python -m PyInstaller --noconfirm --clean --windowed --onedir --name "FLUYNOVA-$product" --icon assets/fluynova.ico "$script"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Instalar Inno Setup si no está instalado
        shell: pwsh
        run: |
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Crear seis instaladores Windows
        working-directory: productos
        shell: pwsh
        run: |
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'No se encontró Inno Setup' }
          foreach ($product in @('Pedidos','Turnos','Stock','Fabrica','Evidencia','LicenciasOperador')) {
            & $iscc "/DProduct=$product" 'installer\product.iss'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files=Get-ChildItem 'out\*.exe'
          if ($files.Count -ne 6) { throw "Se esperaban seis instaladores, encontramos $($files.Count)" }
          Get-FileHash out\*.exe -Algorithm SHA256 | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: FLUYNOVA-Windows-trial-14-dias-v0.2.0
          path: productos/out/*.exe
          if-no-files-found: error
          retention-days: 60
      - name: Publicar release para pilotos de Windows
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.2.0-trial'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag productos/out/*.exe --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag productos/out/*.exe --title 'FLUYNOVA Suite 0.2.0 · Prueba 14 días · Windows x64' --notes 'PILOTO: 5 aplicaciones independientes con pruebas de 14 días y licencia Ed25519 ligada al dispositivo. Incluye emisor de licencias SIN clave privada. La clave privada NO se publica en GitHub ni viaja en instaladores. Sin firma Authenticode; probar en Windows 10/11 antes de comercializar. Los datos SQLite no se borran al vencer la prueba. El pago y la emisión de licencia son manuales.' --prerelease --latest=false --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

