name: FLUYNOVA — candidato estático limpio desde main

on:
  push:
    branches:
      - feature/fluynova-static-clean-from-main-20261107
    paths:
      - 'scripts/build-static-main-preview.mjs'
      - 'scripts/verify-static-routes.mjs'
      - 'tests/static-clean-main.test.mjs'
      - 'tests/static-native-contact.test.mjs'
      - 'tests/verify-static-routes.test.mjs'
      - 'scripts/build-static-native-contact.mjs'
      - 'static/**'
      - '.github/workflows/fluynova-static-clean-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout rama de origen
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis del constructor y del verificador
        run: |
          node --check scripts/build-static-main-preview.mjs
          node --check scripts/verify-static-routes.mjs
          node --check scripts/build-static-native-contact.mjs
      - name: Pruebas locales, sin solicitudes HTTP
        run: node --test tests/static-clean-main.test.mjs tests/verify-static-routes.test.mjs tests/static-native-contact.test.mjs
      - name: Construir vista estática a partir de static/ de main
        run: node scripts/build-static-main-preview.mjs
      - name: Verificar todas las referencias internas del artefacto resultante
        run: node scripts/verify-static-routes.mjs dist-static-main-preview
      - name: Impedir publicaciones y entregas activas en el artefacto
        run: |
          test -f dist-static-main-preview/index.html
          test ! -e dist-static-main-preview/sitemap.xml
          grep -q 'data-preview-contact="disabled"' dist-static-main-preview/index.html
          grep -q 'Disallow: /' dist-static-main-preview/robots.txt
          ! grep -q 'fetch(' dist-static-main-preview/main.js
          ! grep -q 'fetch(' dist-static-main-preview/guardian/guardian.js
