name: FLUYNOVA — API admin aislada (NO publicar)

on:
  push:
    branches:
      - feature/fluynova-public-intake-isolated-20261108
    paths:
      - 'infra/fluynova-admin-readonly-worker/**'
      - 'infra/fluynova-public-intake-worker/mail-admin-report.mjs'
      - '.github/workflows/fluynova-admin-readonly-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-auth-workerd-local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar ruta y configuración cerradas
        working-directory: infra/fluynova-admin-readonly-worker
        run: |
          node --check index.mjs
          node --check admin.test.mjs
      - name: Verificar assets embebidos y paquete administrativo sin publicar
        working-directory: infra/fluynova-admin-readonly-worker
        run: |
          node --check tools/generate-admin-assets.mjs
          node --check tools/build-review-package.mjs
          node tools/generate-admin-assets.mjs --check
          node --test tools/package.test.mjs
          node --check tools/release-preflight.mjs
          node --check tools/release-preflight.test.mjs
          node --test tools/release-preflight.test.mjs
          node tools/release-preflight.mjs --write
          node tools/release-preflight.mjs --check
      - name: Instalar solo herramientas locales y verificador criptográfico
        working-directory: infra/fluynova-admin-readonly-worker
        run: npm install --no-audit --no-fund
      - name: Firmas RS256 y D1 local, red externa completamente interceptada
        working-directory: infra/fluynova-admin-readonly-worker
        run: timeout --signal=TERM --kill-after=3s 120s npm test
      - name: Instalar Chromium solo para pruebas locales de UI
        working-directory: infra/fluynova-admin-readonly-worker
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.65.0
          npx playwright install --with-deps --only-shell chromium
      - name: Probar interfaz de administración con Access JWT + D1 local, sin red externa
        working-directory: infra/fluynova-admin-readonly-worker
        run: timeout --signal=TERM --kill-after=3s 150s node --test dashboard.browser.test.mjs
      - name: Preparar ZIP reproducible solo para revisión, SIN publicar
        working-directory: infra/fluynova-admin-readonly-worker
        run: |
          node tools/build-review-package.mjs
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          folder=Path("review-dist")
          files=sorted(p for p in folder.iterdir() if p.is_file())
          assert len(files)==5
          with ZipFile("fluynova-admin-review-NO-PUBLICAR.zip","w") as z:
              for path in files:
                  info=ZipInfo(path.name,(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  info.external_attr=0o644 << 16
                  z.writestr(info,path.read_bytes())
          PY
      - name: Guardar reporte de puertas de liberación (solo offline)
        uses: actions/upload-artifact@v4
        with:
          name: fluynova-admin-release-readiness-BLOCKED
          path: infra/fluynova-admin-readonly-worker/ADMIN_RELEASE_READINESS.json
          if-no-files-found: error
          retention-days: 7
      - name: Publicar artefacto de CI (NO es publicación web)
        uses: actions/upload-artifact@v4
        with:
          name: fluynova-admin-review-NO-PUBLICAR
          path: infra/fluynova-admin-readonly-worker/fluynova-admin-review-NO-PUBLICAR.zip
          if-no-files-found: error
          retention-days: 7
      - name: Construir candidato admin sin desplegarlo
        working-directory: infra/fluynova-admin-readonly-worker
        run: npm run dryrun
        env:
          WRANGLER_SEND_METRICS: 'false'
