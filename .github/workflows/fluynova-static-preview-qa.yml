name: FLUYNOVA — control de vista comercial estática

on:
  push:
    branches:
      - feature/web-comercial-estatica-preview-20261105
    paths:
      - scripts/build-static-commercial-preview.mjs
      - scripts/verify-static-routes.mjs
      - tests/static-commercial-preview.test.mjs
      - tests/verify-static-routes.test.mjs
      - .github/workflows/fluynova-static-preview-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas offline de compilador y rutas
        run: node --test tests/static-commercial-preview.test.mjs tests/verify-static-routes.test.mjs
      - name: Compilar vista previa (sin desplegar ni enviar formularios)
        run: node scripts/build-static-commercial-preview.mjs
      - name: Verificar enlaces y recursos reales de las 14 páginas
        run: node scripts/verify-static-routes.mjs dist-commercial-static-preview
