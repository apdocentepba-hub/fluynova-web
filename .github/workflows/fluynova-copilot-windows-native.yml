name: FLUYNOVA Copilot - Validacion Windows nativa SIN PUBLICAR
on:
  push:
    branches: ['feature/fluynova-municipios-piloto-20261109']
    paths:
      - 'experimentos/fluynova-copilot/**'
      - '.github/workflows/fluynova-copilot-windows-native.yml'
  pull_request:
    paths:
      - 'experimentos/fluynova-copilot/**'
      - '.github/workflows/fluynova-copilot-windows-native.yml'
concurrency:
  group: fluynova-copilot-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-nativo:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar Windows nativo y Node 24
        shell: pwsh
        run: node -e "if (process.platform !== 'win32' || Number(process.versions.node.split('.')[0]) < 24) process.exit(3); console.log('Windows GitHub runner',process.platform,process.arch,process.version)"
      - name: Instalar dependencias fijadas del laboratorio sin scripts
        shell: pwsh
        run: npm install --prefix experimentos/fluynova-copilot --ignore-scripts --no-audit --no-fund
      - name: Preparar idioma espanol de Tesseract con integridad verificada
        shell: pwsh
        run: node experimentos/fluynova-copilot/PREPARAR-MODELO-OCR.mjs --autorizar-descarga
      - name: Comprobar sintaxis MJS en Windows
        shell: pwsh
        run: |
          Get-ChildItem 'experimentos/fluynova-copilot' -Filter '*.mjs' -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax invalid $($_.Name)" }
          }
      - name: Tests monetarios manuales PDF y API en Windows
        shell: pwsh
        run: node --test --test-concurrency=1 experimentos/fluynova-copilot/money-ar.test.mjs experimentos/fluynova-copilot/verify-money.test.mjs experimentos/fluynova-copilot/manual-review.test.mjs experimentos/fluynova-copilot/manual-review.api.test.mjs experimentos/fluynova-copilot/browser-launch-windows.test.mjs experimentos/fluynova-copilot/pdf-text.test.mjs experimentos/fluynova-copilot/pdf-api.test.mjs experimentos/fluynova-copilot/ocr-image.test.mjs experimentos/fluynova-copilot/ocr-api.test.mjs
      - name: OCR real y subprocesos de PDF y OCR en Windows
        shell: pwsh
        run: node --test --test-concurrency=1 experimentos/fluynova-copilot/ocr-real.test.mjs experimentos/fluynova-copilot/isolated-processing.test.mjs
      - name: Diagnostico y CMD nativo Windows sin descargas
        shell: pwsh
        run: node --test experimentos/fluynova-copilot/startup-preflight.test.mjs experimentos/fluynova-copilot/windows-preflight-native.test.mjs
      - name: Smoke integral de servidor 127.0.0.1 con comprobantes ficticios
        shell: pwsh
        run: node --test experimentos/fluynova-copilot/windows-smoke.test.mjs
      - name: Instalar Chromium para prueba real de UI Windows
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --only-shell chromium
      - name: Probar revision asistida en Chromium nativo Windows
        shell: pwsh
        run: node --test experimentos/fluynova-copilot/manual-review.browser.test.mjs
      - name: Empaquetar y probar ZIP offline de Windows
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'FLUYNOVA-COPILOT-ENSAYO-WINDOWS.zip'
          & './experimentos/fluynova-copilot/CREAR-PAQUETE-PRUEBA-WINDOWS.ps1' -Destination $zip
          $out=Join-Path $env:RUNNER_TEMP 'copilot-zip-extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $out
          foreach($file in @('INICIAR-COPILOT-WINDOWS.cmd','DIAGNOSTICAR-COPILOT-WINDOWS.cmd','LEEME-PRIMERO.txt','SHA256SUMS.txt','server.mjs','startup-preflight.mjs')) {
            if(-not(Test-Path -LiteralPath (Join-Path $out $file))){throw "ZIP incompleto: $file"}
          }
          $bad=Get-ChildItem -LiteralPath $out -Recurse -Force | Where-Object {
            $_.Name -match '(^\.env|node_modules|traineddata|\.test\.mjs$|\.pdf$|\.png$|\.jpe?g$)'
          }
          if($bad){throw 'ZIP contiene archivos fuera de la lista blanca'}
          Get-ChildItem -LiteralPath $out -Filter '*.mjs' -File | ForEach-Object {
            node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "Sintaxis invalida $($_.Name)"}
          }
          $listener=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start()
          $port=$listener.LocalEndpoint.Port
          $listener.Stop()
          $env:FLUYNOVA_PORT="$port"
          $env:FLUYNOVA_OPEN_BROWSER='0'
          $proc=Start-Process -FilePath 'node' -ArgumentList 'server.mjs' -WorkingDirectory $out -NoNewWindow -PassThru
          try{
            $ready=$false
            for($i=0;$i -lt 25;$i++){
              Start-Sleep -Milliseconds 200
              try{
                $status=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 2
                if($status.runtime -eq 'LOCAL_ONLY' -and $status.human_review_required -eq $true){
                  $ready=$true;break
                }
              }catch{}
              if($proc.HasExited){break}
            }
            if(-not $ready){throw 'No inicio el servidor desde el ZIP extraido'}
            Write-Output 'ZIP_SMOKE: PASS | Windows | 127.0.0.1 | sin dependencias ni Ollama'
          }finally{
            if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:FLUYNOVA_PORT -ErrorAction SilentlyContinue
            Remove-Item Env:FLUYNOVA_OPEN_BROWSER -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FLUYNOVA-COPILOT-ENSAYO-WINDOWS
          path: ${{ runner.temp }}/FLUYNOVA-COPILOT-ENSAYO-WINDOWS.zip
          if-no-files-found: error
          retention-days: 7
