name: FLUYNOVA reel de demos propias 2026-11-03
on:
  push:
    branches:
      - 'feature/reel-demos-fluynova-20261103'
    paths:
      - 'marketing/reels/fluynova_demos_20261103/build_reel.py'
      - '.github/workflows/fluynova-real-demo-reel.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fluynova-real-demo-reel
  cancel-in-progress: false
jobs:
  real-demo-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias gratuitas y navegacion real
        run: |
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          python -m compileall -q marketing/reels/fluynova_demos_20261103/build_reel.py
      - name: Capturar ambas webs ficticias y generar video 9x16
        run: |
          python marketing/reels/fluynova_demos_20261103/build_reel.py
      - name: Auditoria MP4 y capturas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('marketing/reels/fluynova_demos_20261103')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['width']==1080 and manifest['height']==1920
          assert 18.0 <= manifest['duration_seconds'] <= 20.0
          assert manifest['bytes']>1_000_000
          asserts = ['pasteleria_inicio.png','pasteleria_interior.png','distribuidora_inicio.png','distribuidora_interior.png']
          for f in asserts:
              p=root/'captures'/f
              with Image.open(p) as im:
                  im.verify()
              print('SOURCE_CAPTURE_OK', f)
          for p in sorted((root/'frames').glob('scene_*.jpg')):
              with Image.open(p) as im:
                  assert im.size==(1080,1920)
                  im.verify()
              print('SCENE_OK',p.name)
          print('VIDEO_BYTES',manifest['bytes'])
          print('VIDEO_SHA256',manifest['sha256'])
          PY
      - name: Respaldar capturas originales en evidencia CI
        uses: actions/upload-artifact@v4
        with:
          name: fluynova-reel-source-screenshots
          path: marketing/reels/fluynova_demos_20261103/captures/*.png
          retention-days: 7
      - name: Guardar MP4 y vista previa solo en esta rama
        run: |
          git config user.name 'FLUYNOVA Creative Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/reels/fluynova_demos_20261103/fluynova_demos_reel.mp4
          git add marketing/reels/fluynova_demos_20261103/contact_sheet.jpg
          git add marketing/reels/fluynova_demos_20261103/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Crear Reel vertical original de dos webs ficticias FLUYNOVA'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
