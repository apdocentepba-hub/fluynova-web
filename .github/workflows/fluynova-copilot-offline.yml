name: FLUYNOVA Copilot - Node local, SIN PUBLICAR
on:
  push:
    branches: ['feature/fluynova-municipios-piloto-20261109']
    paths:
      - 'experimentos/fluynova-copilot/**'
      - '.github/workflows/fluynova-copilot-offline.yml'
  pull_request:
    paths:
      - 'experimentos/fluynova-copilot/**'
      - '.github/workflows/fluynova-copilot-offline.yml'
concurrency:
  group: fluynova-copilot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  copilot-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar parser PDF fijado, solo en CI de laboratorio
        run: npm install --prefix experimentos/fluynova-copilot --ignore-scripts --no-audit --no-fund
      - name: Preparar modelo OCR español FIJADO para prueba real
        run: node experimentos/fluynova-copilot/PREPARAR-MODELO-OCR.mjs --autorizar-descarga
      - name: Control de sintaxis de todos los módulos MJS del laboratorio
        run: find experimentos/fluynova-copilot -maxdepth 1 -type f -name '*.mjs' -print0 | xargs -0 -n 1 node --check
      - name: Pruebas unitarias y HTTP, sin modelo LLM
        run: |
          node --test --test-concurrency=1 \
            experimentos/fluynova-copilot/copilot.test.mjs \
            experimentos/fluynova-copilot/money-ar.test.mjs \
            experimentos/fluynova-copilot/verify-money.test.mjs \
            experimentos/fluynova-copilot/corpus.test.mjs \
            experimentos/fluynova-copilot/pdf-text.test.mjs \
            experimentos/fluynova-copilot/pdf-api.test.mjs \
            experimentos/fluynova-copilot/ocr-image.test.mjs \
            experimentos/fluynova-copilot/ocr-api.test.mjs \
            experimentos/fluynova-copilot/ocr-provenance.test.mjs \
            experimentos/fluynova-copilot/ocr-score.test.mjs \
            experimentos/fluynova-copilot/ocr-readability.test.mjs \
            experimentos/fluynova-copilot/pdf-scan-api.test.mjs
      - name: OCR REAL de imagen, modelo español OFFLINE
        run: node --test experimentos/fluynova-copilot/ocr-real.test.mjs
      - name: 'Procesadores aislados: OCR/PDF real, crash y timeout'
        run: node --test experimentos/fluynova-copilot/isolated-processing.test.mjs
      - name: Medir errores OCR reales en cuatro imágenes ficticias diferentes
        run: node experimentos/fluynova-copilot/OCR-BENCHMARK-REAL.mjs
      - name: Evaluar estrés de OCR real con imágenes degradadas y cifras similares
        run: node experimentos/fluynova-copilot/OCR-ESTRES-REAL.mjs
      - name: Medir precisión de reglas con 53 comprobantes ficticios
        run: node experimentos/fluynova-copilot/BENCHMARK-CORPUS.mjs
      - name: Diagnóstico de inferencia con Ollama FICTICIO en localhost
        run: node --test experimentos/fluynova-copilot/diagnostico.test.mjs
      - name: Instalar Chromium para pruebas de interfaz sin API externa
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --with-deps --only-shell chromium
      - name: Probar interfaz con modelo simulado, solicitudes externas bloqueadas
        run: node --test experimentos/fluynova-copilot/copilot.browser.test.mjs
      - name: PDF escaneado de extremo a extremo con Tesseract REAL y sin Qwen
        run: node --test experimentos/fluynova-copilot/pdf-scan-ocr-real.browser.test.mjs
