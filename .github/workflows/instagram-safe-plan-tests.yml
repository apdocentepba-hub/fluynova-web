name: FLUYNOVA - Instagram planner safe tests
on:
  pull_request:
    paths:
      - 'marketing/instagram_safe_plan.py'
      - 'marketing/instagram_media_verify.py'
      - 'marketing/instagram_idempotency.py'
      - 'marketing/instagram_preflight.py'
      - 'tests/test_instagram_safe_plan.py'
      - 'tests/test_instagram_media_verify.py'
      - 'tests/test_instagram_idempotency.py'
      - 'tests/test_instagram_preflight.py'
      - '.github/workflows/instagram-safe-plan-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow para validación de imágenes
        run: python -m pip install 'Pillow>=10,<13'
      - name: Pruebas locales sin acceso a cuentas
        run: |
          python -m compileall -q marketing/instagram_safe_plan.py marketing/instagram_media_verify.py marketing/instagram_idempotency.py marketing/instagram_preflight.py tests/test_instagram_safe_plan.py tests/test_instagram_media_verify.py tests/test_instagram_idempotency.py tests/test_instagram_preflight.py
          python -m unittest discover -s tests -p 'test_instagram_*.py' -v
      - name: Comprobación externa opcional de medios públicos (no publica)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from marketing.instagram_media_verify import verify_image
          urls = [
            "https://static.metricool.com/planner/202610/7583853-file-6716034308320785165.jpeg",
            "https://static.metricool.com/planner/202610/7583853-file-788793735921275255.jpeg",
            "https://raw.githubusercontent.com/apdocentepba-hub/fluynova-web/main/marketing/growth/fluynova-turnos-guia-20261109.jpg"
          ]
          failures = 0
          for url in urls:
              verdict = verify_image(url)
              print(verdict, flush=True)
              failures += verdict["status"] != "VERIFIED"
          sys.exit(1 if failures else 0)
          PY
