# PRUEBA SINTÉTICA ÚNICA AUTORIZADA EL 15/11/2026
# Este workflow SOLO dispara al agregar/modificar SU archivo en esta rama.
# No incluir en main ni usar para marketing o envíos recurrentes.
name: FLUYNOVA FormSubmit smoke puntual autorizado
on:
  push:
    branches:
      - feature/diagnostico-correo-directo-20261115
    paths:
      - .github/workflows/formsubmit-smoke-once-20261115.yml

permissions:
  contents: read

jobs:
  unique-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Una sola solicitud de prueba con datos ficticios al proveedor existente
        env:
          QA_MARKER: FLUYNOVA-QA-FORMSUBMIT-20261115-01
        run: |
          set -euo pipefail
          payload='{"name":"FLUYNOVA QA AUTORIZADO","email":"contacto.fluynova@gmail.com","organization":"DEMO FICTICIA","category":"Automatizar tareas","message":"Prueba técnica autorizada del proveedor FormSubmit. No es un cliente ni una oportunidad comercial. Identificador: FLUYNOVA-QA-FORMSUBMIT-20261115-01.","origen_fuente":"qa_controlado","origen_canal":"github_actions","origen_campania":"verificacion_entrega_20261115","origen_mensaje":"prueba_sintetica","_subject":"FLUYNOVA QA FormSubmit FLUYNOVA-QA-FORMSUBMIT-20261115-01","_replyto":"contacto.fluynova@gmail.com","_template":"table","_honey":""}'
          code=$(curl -sS --retry 0 --connect-timeout 8 --max-time 30 -X POST "https://formsubmit.co/ajax/contacto.fluynova@gmail.com" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -o formsubmit-result.json -w '%{http_code}' --data "$payload")
          echo "FORMSUBMIT_HTTP_STATUS=$code"
          test "$code" -ge 200
          test "$code" -lt 300
          node -e 'const fs=require("fs");let j;try{j=JSON.parse(fs.readFileSync("formsubmit-result.json","utf8"))}catch{throw Error("Proveedor no devolvió JSON")};if(!(j.success===true||j.success==="true"))throw Error("Proveedor no confirmó success=true");console.log("FORMSUBMIT_PROVIDER_ACCEPTED=true; ENTREGA_GMAIL=PENDIENTE")'
