name: Crear piezas originales de crecimiento FLUYNOVA y APD
on:
  push:
    branches: [main]
    paths:
      - 'marketing/build_growth_images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  growth-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generar recursos 1080x1350
        run: python marketing/build_growth_images.py
      - name: Guardar imágenes generadas
        run: |
          git config user.name 'FLUYNOVA Social'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/growth/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Agregar material educativo para campañas organicas'
            git push origin HEAD:main
          fi
