name: FLUYNOVA correo manual sin envíos — QA offline
on:
  pull_request:
    paths:
      - 'static/index.html'
      - 'static/contact-mailto.js'
      - 'tests/contact-mailto-fallback.test.cjs'
      - 'tests/contact-mailto-browser-qa.mjs'
      - '.github/workflows/fluynova-contact-mailto-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis sin tráfico de red
        run: |
          node --check static/contact-mailto.js
          node --check tests/contact-mailto-fallback.test.cjs
      - name: Probar borrador, validación, privacidad y alternativa copiar
        run: node --test tests/contact-mailto-fallback.test.cjs
      - name: Regresión formulario y diagnóstico existentes
        run: node --test tests/fluynova-web-lead-category.test.js tests/diagnostico-contacto-directo.test.mjs
      - name: Verificar Chrome disponible
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Chrome real, 320/390/1440 y API caída sin envíos
        run: node tests/contact-mailto-browser-qa.mjs
      - name: Adjuntar capturas de prueba local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluynova-correo-manual-chrome
          path: qa-correo-manual/
          if-no-files-found: warn
          retention-days: 7
