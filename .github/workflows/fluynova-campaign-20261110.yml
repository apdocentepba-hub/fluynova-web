name: FLUYNOVA carrusel comercial 10 noviembre
on:
  push:
    branches:
      - 'campaign/fluynova-20261110-tiempo'
    paths:
      - 'marketing/campaigns/fluynova_20261110/asset_builder.py'
      - '.github/workflows/fluynova-campaign-20261110.yml'
permissions:
  contents: write
concurrency:
  group: fluynova-campaign-20261110
  cancel-in-progress: false
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias y sintaxis
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m compileall -q marketing/campaigns/fluynova_20261110/asset_builder.py
      - name: Generar 3 imágenes y comprobar contenido gráfico
        run: |
          python marketing/campaigns/fluynova_20261110/asset_builder.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path('marketing/campaigns/fluynova_20261110')
          files=sorted(folder.glob('0[123]_*.jpg'))
          assert len(files)==3, files
          for p in files:
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'JPEG' and im.size == (1080,1350)
              assert 30000 < p.stat().st_size < 8000000
              print(p, p.stat().st_size)
          PY
      - name: Incorporar los JPEG solo a rama de campaña
        run: |
          git config user.name 'FLUYNOVA Campaign Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/campaigns/fluynova_20261110/*.jpg marketing/campaigns/fluynova_20261110/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generar carrusel FLUYNOVA 10 nov (3 JPEG originales)'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Comprobar URL pública y checksum de cada JPEG
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          folder = Path('marketing/campaigns/fluynova_20261110')
          data = json.loads((folder/'manifest.json').read_text())
          for item in data['files']:
              url = 'https://raw.githubusercontent.com/apdocentepba-hub/fluynova-web/campaign/fluynova-20261110-tiempo/marketing/campaigns/fluynova_20261110/' + item['file']
              error = None
              for trial in range(8):
                  try:
                      with urllib.request.urlopen(url, timeout=8) as response:
                          blob=response.read(2_000_000)
                          assert response.status==200
                          assert response.headers.get('Content-Type', '').startswith('image/jpeg')
                      digest=hashlib.sha256(blob).hexdigest()
                      if digest != item['sha256']:
                          raise ValueError('checksum does not match source')
                      print('PUBLIC_URL_OK', item['file'], len(blob), digest)
                      error = None
                      break
                  except Exception as exc:
                      error = exc
                      time.sleep(2)
              if error is not None:
                  raise RuntimeError(f'Asset {item["file"]} could not be publicly verified: {error}') from error
          PY
